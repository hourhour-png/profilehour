<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: Arial, sans-serif;
        }

        /* Profile Card */
        .profile-card {
            width: 350px;
            max-width: 90%;
            background: white;
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-8px);
        }

        /* Profile Image */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #e8e8e8;
            margin-bottom: 15px;
        }

        .profile-card h2 {
            font-size: 25px;
            font-weight: bold;
            color: #222;
        }

        .profile-card p {
            color: #777;
            margin-bottom: 25px;
        }

        /* Social Media Buttons */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .social-btn i {
            font-size: 22px;
        }

        .social-btn:hover {
            transform: scale(1.04);
            color: white;
            opacity: 0.9;
        }

        /* Facebook */
        .facebook {
            background: #1877F2;
        }

        /* Instagram */
        .instagram {
            background: #E1306C;
        }

        /* TikTok */
        .tiktok {
            background: #111111;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <!-- Profile Image -->
        <img src="../profile/hour12.jpg" alt="Sun Hour" class="profile-img">

        <!-- Profile Information -->
        <h2>Sun Hour</h2>
        <p>Welcome to my social media</p>

        <!-- Facebook -->
        <a href="https://www.facebook.com/share/1E3EUFgya1/?mibextid=wwXIfr"
           
           rel="noopener noreferrer"
           class="social-btn facebook">
            <i class="fab fa-facebook"></i>
            Facebook
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/benzersam?vrfl=MXFqYW1rejgxZ3Nicg%3D%3D&utm_source=qr"
           
           rel="noopener noreferrer"
           class="social-btn instagram">
            <i class="fab fa-instagram"></i>
            Instagram
        </a>

        <!-- TikTok -->
        <a href="https://www.tiktok.com/@benzerhour?_r=1&_t=ZS-9AocSKZY59p"
           
           rel="noopener noreferrer"
           class="social-btn tiktok">
            <i class="fab fa-tiktok"></i>
            TikTok
        </a>

        <div class="footer">
            © 2026 My Social Profile
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Display a message when the profile card loads
        window.onload = function () {
            console.log("Social Media Profile Card Loaded!");
        };
    </script>
</body>
</html>
